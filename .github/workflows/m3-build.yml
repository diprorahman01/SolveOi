
name: SolveOi M3 Build

on:
  push:
    branches: [main]
    paths:
      - "apps/customer/**"
      - ".github/workflows/m3-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Validate M3 on Linux
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/customer

    env:
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_SECRET: ${{ secrets.M3_BETTER_AUTH_SECRET }}
      MONGODB_URI: ${{ secrets.M3_MONGODB_URI }}
      MONGODB_DB_NAME: solveoi_dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/customer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check required secrets
        run: |
          test -n "$BETTER_AUTH_SECRET"
          test -n "$MONGODB_URI"

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build M3
        run: npm run build
